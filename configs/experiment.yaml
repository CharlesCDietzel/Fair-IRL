# Experiment configuration for `frwo` (src/frwo/FRWO_Biased_Demonstrations.py).
#
# Every UPPERCASE key is a config value. Each experiment's `exp_info` -- the
# dict the experiment code reads, and that every W&B run records as its config
# -- is built by merging, in order:
#   1. `common`,
#   2. the experiment's own keys,
#   3. any `--set KEY=VALUE` overrides given on the command line (or chosen by
#      a W&B sweep, see configs/sweeps/).
# The top-level RANDOM_SEED, SELECTED_DATASETS and EXPERT_ALGOS can be
# overridden with `--set` the same way.
#
# lowercase keys (`common` and `experiments`) only give the file its structure.
#
# NOTE: write small floats with a decimal point (`1.0e-5`, not `1e-5`); YAML
# reads `1e-5` as a string.

RANDOM_SEED: 42

# Which of the `experiments` below to run.
SELECTED_DATASETS:
  - COMPAS
  - Adult
  - ACSIncome__MA
  - ACSIncome__MS
  # - ACSIncome__CA
  # - ACSIncome__IL
  # - ACSIncome__AL
  # - ACSIncome__HI

# The experts whose demonstrations are learned from. Every selected experiment
# is run once per expert.
EXPERT_ALGOS:
  - OptClfMDPPol
  # A logistic regression post-processed by a fairlearn ThresholdOptimizer,
  # fit on a class-balanced subsample. It takes its fairness constraint from
  # SH_DEMO_CONSTRAINTS below.
  # - PostProcDemo
  # - OptAcc
  # - CatBoostOptAcc
  # - XGBoostOptAcc
  # - HardtDemPar
  # - HardtEqOpp
  # - HardtTNRPar
  # - HardtFPRPar
  # - HardtFNRPar
  # - HardtEqOdds
  # - BoundedGroupLoss
  # - COMPAS

# Common config, shared by every experiment.
common:
  # Every objective available to FEAT_EXP_OBJECTIVE_NAMES and
  # PERF_MEAS_OBJECTIVE_NAMES: Acc, AccPar, DemPar, EqOpp, FPRPar, EqOdds,
  # TNRPar, FNRPar, PR_Z0, PR_Z1, NR_Z0, NR_Z1, TPR_Z0, TPR_Z1, TNR_Z0, TNR_Z1,
  # FPR_Z0, FPR_Z1, FNR_Z0, FNR_Z1, PredPar, NegPredPar.
  FEAT_EXP_OBJECTIVE_NAMES:
    - Acc
    - AccPar
    - DemPar
    - EqOpp
    # - FPRPar
    # - EqOdds
    - TNRPar
    # - FNRPar
    # - PR_Z0
    # - PR_Z1
    # - NR_Z0
    # - NR_Z1
    # - TPR_Z0
    # - TPR_Z1
    # - TNR_Z0
    # - TNR_Z1
    # - FPR_Z0
    # - FPR_Z1
    # - FNR_Z0
    # - FNR_Z1
  PERF_MEAS_OBJECTIVE_NAMES:
    - Acc
    - AccPar
    - DemPar
    - EqOpp
    - FPRPar
    - EqOdds
    - TNRPar
    - FNRPar
    # - PR_Z0
    # - PR_Z1
    # - TPR_Z0
    # - TPR_Z1
    # - TNR_Z0
    # - TNR_Z1
    # - FPR_Z0
    # - FPR_Z1
    # - FNR_Z0
    # - FNR_Z1
    - PredPar
    - NegPredPar
  USE_HIDDEN_FEATURES_SOURCE: true
  N_EXPERT_DEMOS: 2
  RESTRICT_Y_ACTION: true
  IRL_METHOD: FRWO

  ##
  # FRWO Policy learning parameters
  ##
  # The LP solver of every optimal classifier policy (options: 'highs',
  # 'highs-ds', 'highs-ipm'). Not tuned: the expert's policy (OptClfMDPPol) is
  # solved with it too, so changing it would also change the demonstrations
  # every technique is scored against. All three solve the LP exactly, so
  # they should only differ in which policy they return when several are
  # equally optimal.
  METHOD: highs
  # The random forest that predicts `y` from `x` for the policies Fairness
  # Reward Weight Optimization learns. Those policies cannot observe `y`, so it
  # decides which MDP state each row is in. The defaults are scikit-learn's.
  # The expert's own random forest is separate, and unaffected by these.
  FRWO_CLF_N_ESTIMATORS: 100
  FRWO_CLF_MAX_DEPTH: null  # (null: unlimited)
  FRWO_CLF_MIN_SAMPLES_LEAF: 1
  # The regularization `lamda` of the `alpha` scaling of the subdominance the
  # `opt_debias` weight search minimizes: the counterpart of the Superhuman
  # Fairness baselines' SH_*LAMDA. It does not change the subdominance
  # reported as a result, which always uses lamda = 0.001.
  OPT_DEBIAS_LAMDA: 0.001
  N_TRIALS: 3
  N_SUBDOMINANCE_GROUPS: 50
  DOT_WEIGHTS_FEAT_EXP: true
  N_DATASET_SAMPLES: null

  # The weight adjustments Fairness Reward Weight Optimization learns a policy
  # for, each in its own W&B run. A run with the unadjusted weights is always
  # performed first, ahead of every adjustment listed here.
  WEIGHT_ADJUST_LIST:
    # - [mul_negative_weights, 0.0]
    # - [mul_negative_weights, 0.1]
    # - [mul_negative_weights, 0.2]
    # - [mul_negative_weights, 0.3]
    # - [mul_negative_weights, 0.4]
    # - [mul_negative_weights, 0.5]
    # - [mul_negative_weights, 0.6]
    # - [mul_negative_weights, 0.7]
    # - [mul_negative_weights, 0.8]
    # - [mul_negative_weights, 0.9]
    # Optimization-based weight debiasing for Fairness Reward Weight
    # Optimization
    # Which optimizer is best is tuned per dataset in `experiments`. A sweep
    # tunes it through the OPT_DEBIAS_OPTIMIZER override (e.g.
    # `--set OPT_DEBIAS_OPTIMIZER=optuna/TPE`), which swaps the library and
    # optimizer of every `opt_debias` entry here and keeps its budget.
    - [opt_debias, optuna, GP, 200]
    # - [opt_debias, optuna, SMAC, 200]
    # - [opt_debias, optuna, TPE, 200]
    # - [opt_debias, pybobyqa, Multi-Start BOBYQA, 200]

  # The bias types each experiment is run under. The unbiased run is always
  # performed first, then every dataset bias type, then every demo bias type,
  # each on its own: a dataset bias type with the expert's demonstrations
  # otherwise unbiased, a demo bias type on the unbiased dataset.
  #
  # Dataset bias types bias the dataset itself before it is split, so the
  # expert learns from it and everything is scored against it:
  #   [dataset_unbalanced_redlining, percent]
  #       Sets the "bad" outcome for `percent` of the redlined group (z = 0).
  #   [dataset_balanced_redlining, percent]
  #       As above, and sets the "good" outcome for an equal number of the
  #       other group.
  #   [dataset_perfectly_balanced_redlining, percent]
  #       Flips `percent` of the redlined group's "good" outcomes to "bad",
  #       and an equal number of the other group's "bad" outcomes to "good".
  #   [dataset_noise_bias, noise_ratio, label_noise, protected_noise]
  #       Like `add_noise_new()` of the Superhuman Fairness reference
  #       implementation: flips the labels (if label_noise) of a random
  #       noise_ratio of the rows, and the protected attribute z (if
  #       protected_noise) of another, independent random noise_ratio of them.
  #   [dataset_corruption_bias, clf_type, percent, noise_type, magnitude]
  #       Relabels the dataset with a classifier whose learned parameters were
  #       corrupted.
  # (Each "percent" defaults to 0.2 if left out.)
  #
  # To run no bias types of a variety, comment out all of its entries (or
  # write `[]` with no entries below it).
  DATASET_BIAS_TYPE_LIST:
    # - [dataset_unbalanced_redlining, 0.2]
    # - [dataset_balanced_redlining, 0.2]
    # - [dataset_perfectly_balanced_redlining, 0.2]
    # - [dataset_noise_bias, 0.2, true, true]
    # - [dataset_corruption_bias, CatBoost, 0.0001, gaussian, 1.0]
    # - [dataset_corruption_bias, CatBoost, 0.001, gaussian, 1.0]
    # - [dataset_corruption_bias, CatBoost, 0.01, gaussian, 1.0]

  # Demo bias types leave the dataset's labels unchanged and bias the
  # decisions (yhat) the EXPERT_ALGO's demonstrations make instead. They reuse
  # the unbiased run's demonstrations (and subdominance groups) rather than
  # refitting the expert, so each differs from the unbiased run by exactly its
  # bias:
  #   [demo_unbalanced_redlining, percent]
  #   [demo_balanced_redlining, percent]
  #   [demo_perfectly_balanced_redlining, percent]
  #       The dataset redlining bias types above, applied to yhat instead of y.
  #   [demo_noise_bias, noise_ratio]
  #       Like `add_noise()` of the Superhuman Fairness reference
  #       implementation: flips the decisions of a random noise_ratio of the
  #       rows.
  DEMO_BIAS_TYPE_LIST:
    # - [demo_unbalanced_redlining, 0.2]
    # - [demo_balanced_redlining, 0.2]
    # - [demo_perfectly_balanced_redlining, 0.2]
    # - [demo_noise_bias, 0.2]

  # The performance and fairness measures the subdominance metric is computed
  # over. Fairness Reward Weight Optimization optimizes relative to these: its
  # `opt_debias` weight search minimizes the subdominance of the policies the
  # candidate weights produce, scored on exactly these measures. They are also
  # what the Superhuman Fairness baseline optimizes by default (see SH_FEATURES
  # below), and what every technique's figures are plotted on.
  #
  # Entries may be named in either vocabulary, and the two may be mixed:
  #   This project's objectives -- "Acc", "AccPar", "DemPar", "EqOpp",
  #       "FPRPar", "EqOdds", "TNRPar", "FNRPar", "PredPar", "NegPredPar",
  #       and the per-group rates ("PR_Z0", "TPR_Z1", ...). Each is a
  #       "goodness" measure, turned into a loss as `1 - mu`.
  #   The Superhuman Fairness paper's metrics -- "inacc" (prediction error),
  #       "dp", "eqodds", "prp" (the larger of the PPV and NPV differences),
  #       "eqopp", "fnr", "fpr", "ppv", "npv" and "error_rate_diff" (the
  #       balanced error rate difference). These are already losses, computed
  #       exactly as that paper's `util.get_metrics_df()` computes them.
  #
  # Several of the two overlap exactly -- "inacc" is "Acc", "dp" is "DemPar",
  # "fpr" is "TNRPar", "eqopp" and "fnr" are "EqOpp" -- while "prp" and
  # "error_rate_diff" have no objective equivalent. The split between the two
  # lists only sets the weighting of sum-aggregated subdominance, per
  # REWEIGHT_SUBDOMINANCE_OBJECTIVES below.
  SUBDOMINANCE_PERF_METRICS_LIST: [Acc]
  SUBDOMINANCE_FAIR_METRICS_LIST: [AccPar, DemPar, EqOpp, TNRPar]
  # How sum-aggregated subdominance weights the measures above. True gives the
  # perf metrics half the weight and the fair metrics the other half, however
  # many of each there are. False gives every individual metric equal weight,
  # whichever list it is in.
  REWEIGHT_SUBDOMINANCE_OBJECTIVES: false

  # Which techniques to train and evaluate. List any combination of the names
  # below. Each listed technique gets its own W&B run per dataset bias type,
  # produced by the same evaluation code on the same data split, so that their
  # metrics are directly comparable.
  #
  # The eight after FRWO are the Superhuman Fairness technique, three
  # variants of it, and the fair-classification baselines that paper compares
  # itself against:
  #   "Superhuman Fairness Fixed"
  #       Superhuman Fairness with the normalization of its gradient's
  #       feature-matching term fixed, so that it learns from the
  #       demonstration-specific signal instead of drifting toward predicting
  #       every label 0. It shares every SH_* setting below except its own
  #       SH_FIXED_ITERS, SH_FIXED_LR_THETA and SH_FIXED_LAMDA.
  #   "Superhuman Fairness Neural Network"
  #       The neural network version of Superhuman Fairness, from the
  #       reference implementation's `reorg_current` branch. It shares the
  #       SH_* settings below except its own SH_NN_* ones. It needs PyTorch,
  #       and trains on a GPU when PyTorch can see one.
  #   "Superhuman Fairness Neural Network Fixed"
  #       Superhuman Fairness Neural Network with its training loss fixed:
  #       centered on the demonstrations' mean subdominance, so it no longer
  #       drifts toward predicting every label 0, and built from the sampled
  #       decisions, so its gradient learns which decisions beat the
  #       demonstrations. It has its own SH_NN_FIXED_* counterpart of every
  #       SH_NN_* setting.
  #   "Post Proc DP" / "Post Proc EqOdds"
  #       The post-processing model of Hardt et al. (2016), with demographic
  #       parity / equalized odds as the fairness constraint.
  #   "Fair LogLoss DP" / "Fair LogLoss EqOdds"
  #       The robust fair-log-loss model of Rezaei et al. (2020), with
  #       demographic parity / equalized odds as the fairness constraint.
  ALGORITHMS:
    - Fairness Reward Weight Optimization
    - Superhuman Fairness
    - Superhuman Fairness Fixed
    - Superhuman Fairness Neural Network
    - Superhuman Fairness Neural Network Fixed
    - Post Proc DP
    - Post Proc EqOdds
    - Fair LogLoss DP
    - Fair LogLoss EqOdds



  MIN_FREQ_FILL_PCT: 0.0
  ##
  # Superhuman Fairness baseline parameters. Ignored unless one of the
  # "Superhuman Fairness ..." techniques is listed in ALGORITHMS above.
  # The baseline imitates this project's own expert (EXPERT_ALGO), on the same
  # demonstration groups the subdominance metric scores every policy against,
  # so that both techniques imitate the same expert on the same rows.
  ##
  # The performance/fairness measures the baseline optimizes -- the `-f` flag
  # of the original implementation. Entries may be this project's objective
  # names (e.g. "Acc", "DemPar", "TNRPar") or the original paper's metric
  # names ("inacc", "dp", "eqodds", "prp", "eqopp", "fnr", "fpr", "ppv",
  # "npv", "error_rate_diff"). null uses this experiment's
  # SUBDOMINANCE_PERF_METRICS_LIST + SUBDOMINANCE_FAIR_METRICS_LIST, so that
  # the baseline optimizes exactly what both techniques are evaluated on.
  SH_FEATURES: null
  # How many demonstrations to imitate. null uses every subdominance group.
  SH_NUM_DEMOS: null
  # The original's `iters`, `lr_theta` and `lamda`.
  SH_ITERS: 30
  SH_LR_THETA: 0.01
  SH_LAMDA: 0.001
  # Superhuman Fairness Fixed's own `iters`, `lr_theta` and `lamda`, in place
  # of the three above, so that it can be tuned separately.
  SH_FIXED_ITERS: 30
  SH_FIXED_LR_THETA: 0.01
  SH_FIXED_LAMDA: 0.001
  # Superhuman Fairness Neural Network's own `iters`, `lr_theta` and `lamda`,
  # in place of SH_ITERS/SH_LR_THETA/SH_LAMDA. Its `lr_theta` is the network's
  # Adam learning rate: the reference implementation's network ignores
  # `lr_theta` and steps with Adam at 1e-5, which is the value here. (Its own
  # config trains for 40 iterations.)
  SH_NN_ITERS: 30
  SH_NN_LR_THETA: 1.0e-5
  SH_NN_LAMDA: 0.001
  # Its network: two ReLU hidden layers, of SH_NN_HIDDEN_NODES and half as
  # many units, first fit with SH_NN_BASE_FIT_EPOCHS full-batch Adam steps.
  # Both are the reference implementation's.
  SH_NN_HIDDEN_NODES: 512
  SH_NN_BASE_FIT_EPOCHS: 15000
  # Its learning-rate schedule, the reference implementation's: the rate is
  # multiplied by SH_NN_LR_BOOST_FACTOR after the first iteration, and divided
  # by it again the first time the gamma-superhuman sum reaches
  # SH_NN_LR_DECAY_GAMMA_FRAC of the number of features.
  SH_NN_LR_BOOST_FACTOR: 10
  SH_NN_LR_DECAY_GAMMA_FRAC: 0.9
  # The torch device it trains on, e.g. "cpu" or "cuda". null uses a GPU if
  # PyTorch can see one (AMD GPUs included, with a ROCm build of PyTorch), and
  # the CPU otherwise.
  SH_NN_DEVICE: null
  # Superhuman Fairness Neural Network Fixed's own counterparts of every
  # SH_NN_* setting above, so that it can be tuned separately.
  SH_NN_FIXED_ITERS: 30
  SH_NN_FIXED_LR_THETA: 1.0e-5
  SH_NN_FIXED_LAMDA: 0.001
  SH_NN_FIXED_HIDDEN_NODES: 512
  SH_NN_FIXED_BASE_FIT_EPOCHS: 15000
  SH_NN_FIXED_LR_BOOST_FACTOR: 10
  SH_NN_FIXED_LR_DECAY_GAMMA_FRAC: 0.9
  SH_NN_FIXED_DEVICE: null
  # The fairness constraint the PostProcDemo expert satisfies.
  SH_DEMO_CONSTRAINTS: demographic_parity

  ##
  # Fair log-loss baseline parameters. Ignored unless one of the
  # "Fair LogLoss ..." techniques is listed in ALGORITHMS above. Each has its
  # own copy, so that each can be tuned separately. The defaults are what the
  # original implementation passes.
  ##
  # Fair LogLoss DP's L2 regularization strength `C`, and whether its
  # optimizer starts from random coefficients.
  FAIR_LOGLOSS_DP_C: 0.005
  FAIR_LOGLOSS_DP_RANDOM_INIT: true
  # Fair LogLoss EqOdds's own counterparts of the two above.
  FAIR_LOGLOSS_EQODDS_C: 0.005
  FAIR_LOGLOSS_EQODDS_RANDOM_INIT: true

  ##
  # Data split parameters.
  ##
  # The (train, val, test) fractions of each dataset, and what both splits
  # are stratified by: false (nothing), true or 'y' (the label), or 'zy'
  # (each combination of the protected attribute and the label). The
  # Superhuman Fairness baseline trains on (and builds its demonstrations
  # from) the train split.
  DATA_SPLIT_FRACTIONS: [0.6, 0.2, 0.2]
  DATA_SPLIT_STRATIFY: zy
  # The split check. Up to DATA_SPLIT_MAX_TRIES candidate splits are drawn,
  # and the first whose P(z) and P(y=1|z) differ by at most
  # DATA_SPLIT_MAX_IMBALANCE between any two splits, in the unbiased dataset
  # and every dataset bias type's dataset, is used; if none does, the most
  # balanced one is. 1 try disables the check. Drawing all 50 takes under a
  # second per trial on this project's datasets.
  DATA_SPLIT_MAX_TRIES: 50
  DATA_SPLIT_MAX_IMBALANCE: 0.005

