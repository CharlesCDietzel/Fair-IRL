# W&B sweep: tunes Fair LogLoss DP.
#
# Run this sweep for every selected dataset, and write its best values to
# configs/experiment.yaml.new, with:
#   uv run fair-irl-tune --algorithm "Fair LogLoss DP"
#
# Every value not listed under `parameters` comes from configs/experiment.yaml.
name: Fair LogLoss DP
project: fair-irl
method: bayes
metric:
  # The mean validation subdominance (sum_abs_subdominance_val) of the
  # technique's runs; see src/fair_irl/sweep.py.
  name: objective
  goal: minimize
command:
  - ${env}
  - ${interpreter}
  - -m
  - fair_irl.sweep
  - trial
  - --config
  - configs/experiment.yaml
run_cap: 60
parameters:
  ALGORITHMS:
    value: [Fair LogLoss DP]
  # The L2 regularization strength. The original implementation passes
  # 0.005; its classifiers default to 0.001-0.1.
  FAIR_LOGLOSS_DP_C:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 1.0
  FAIR_LOGLOSS_DP_RANDOM_INIT:
    values: [true, false]
