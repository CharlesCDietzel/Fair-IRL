# W&B sweep: tunes Fair LogLoss EqOdds.
#
# Create one sweep per selected dataset, then start an agent for each sweep id
# it prints (from the repository root):
#   uv run python -m fair_irl.sweep create configs/sweeps/fair_logloss_eqodds.yaml
#   uv run wandb agent <entity>/<project>/<sweep id>
#
# Every value not listed under `parameters` comes from configs/experiment.yaml.
name: Fair LogLoss EqOdds
project: fair-irl
method: bayes
metric:
  # The mean validation subdominance (sum_abs_subdominance_val) of the
  # technique's runs; see src/fair_irl/sweep.py.
  name: objective
  goal: minimize
command:
  - ${env}
  - ${interpreter}
  - -m
  - fair_irl.sweep
  - trial
  - --config
  - configs/experiment.yaml
run_cap: 30
parameters:
  ALGORITHMS:
    value: [Fair LogLoss EqOdds]
  # The L2 regularization strength. The original implementation passes
  # 0.005; its classifiers default to 0.001-0.1.
  FAIR_LOGLOSS_EQODDS_C:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 1.0
  FAIR_LOGLOSS_EQODDS_RANDOM_INIT:
    values: [true, false]
