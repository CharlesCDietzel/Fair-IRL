# W&B sweep: tunes FairIRL Bias Reduction.
#
# Create one sweep per selected dataset, then start an agent for each sweep id
# it prints (from the repository root):
#   uv run python -m fair_irl.sweep create configs/sweeps/fairirl_bias_reduction.yaml
#   uv run wandb agent <entity>/<project>/<sweep id>
#
# Every value not listed under `parameters` comes from configs/experiment.yaml.
name: FairIRL Bias Reduction
project: fair-irl
# Its whole search space is the 3 x 7 = 21 combinations below, so a grid
# search tries each exactly once, and then the sweep ends on its own.
method: grid
metric:
  # The mean validation subdominance (sum_abs_subdominance_val) of the
  # technique's runs; see src/fair_irl/sweep.py.
  name: objective
  goal: minimize
command:
  - ${env}
  - ${interpreter}
  - -m
  - fair_irl.sweep
  - trial
  - --config
  - configs/experiment.yaml
parameters:
  ALGORITHMS:
    value: [FairIRL Bias Reduction]
  METHOD:
    values: [highs, highs-ds, highs-ipm]
  # Swaps the library and optimizer of every `opt_debias` entry of
  # WEIGHT_ADJUST_LIST, keeping its evaluation budget (see src/fair_irl/config.py).
  OPT_DEBIAS_OPTIMIZER:
    values:
      - optuna/CMA-ES
      - optuna/GP
      - optuna/TPE
      - pybobyqa/Multi-Start BOBYQA
      - nevergrad/BayesOpt
      - nevergrad/Nelder-Mead
      - nevergrad/Powell
