# W&B sweep: tunes Superhuman Fairness Fixed.
#
# Run this sweep for every selected dataset, and write its best values to
# configs/experiment.yaml.new, with:
#   uv run fair-irl-tune --algorithm "Superhuman Fairness Fixed"
#
# Every value not listed under `parameters` comes from configs/experiment.yaml.
name: Superhuman Fairness Fixed
project: fair-irl
method: bayes
metric:
  # The mean validation subdominance (sum_abs_subdominance_val) of the
  # technique's runs; see src/fair_irl/sweep.py.
  name: objective
  goal: minimize
command:
  - ${env}
  - ${interpreter}
  - -m
  - fair_irl.sweep
  - trial
  - --config
  - configs/experiment.yaml
run_cap: 60
parameters:
  ALGORITHMS:
    value: [Superhuman Fairness Fixed]
  # The reference implementation's defaults are 30 iterations, a learning
  # rate of 0.01 and lamda 0.001; its COMPAS runs use 5 iterations at 0.0001.
  SH_FIXED_ITERS:
    distribution: int_uniform
    min: 5
    max: 60
  # Widened from a maximum of 0.1 after the first sweep's best
  # value landed near it.
  SH_FIXED_LR_THETA:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0
  # Widened from a maximum of 0.1 after the first sweep's best
  # value landed near it.
  SH_FIXED_LAMDA:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0
