[project]
name = "frwo"
version = "0.1.0"
description = "Project code for research related to fairness in machine learning."
readme = "README.md"
authors = [
    { name = "Charles Dietzel", email = "charlescdietzel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "fairlearn>=0.14.0",
    "folktables>=0.0.12",
    "greenlet>=3.5.6",
    "highspy>=1.15.1",
    "imbalanced-learn>=0.14.2",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "optuna>=4.9.0",
    "optunahub>=0.5.0",
    "pandas>=3.0.0",
    "py-bobyqa>=1.5.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "smac>=2.4.1",
    "sweeps>=0.2.0",
    "tabulate>=0.10.0",
    # The following torch packages are pinned to specific versions for
    # compatibility with ROCm 10.1.0, which is the version of ROCm that is
    # currently compatible with the AMD RX 7900XTX GPU. Unpin them when
    # running on a different GPU or ROCm version.
    "torch[device-gfx1100]==2.14.0+rocm10.1.0",
    "torchaudio==2.11.0.3+rocm10.1.0",
    "torchvision[device-gfx1100]==0.29.0a0+rocm10.1.0",
    "wandb>=0.30.0",
    "xgboost>=3.2.0",
]

[project.scripts]
frwo = "frwo.FRWO_Biased_Demonstrations:main"
frwo-pause = "frwo.pause:pause_main"
frwo-resume = "frwo.FRWO_Biased_Demonstrations:resume_main"
frwo-tune = "frwo.sweep:tune_main"
frwo-tune-pause = "frwo.sweep:tune_pause_main"
frwo-tune-resume = "frwo.sweep:tune_resume_main"

[tool.black]
# `src/frwo/sh/fair_logloss.py` is a verbatim vendored copy of the
# reference implementation it names, kept in that project's own formatting so
# it can be diffed against upstream. Reformatting it would destroy that
# property.
extend-exclude = "src/frwo/sh/fair_logloss\\.py"

[tool.uv.sources]
torch = { index = "amd-rocm" }
torchvision = { index = "amd-rocm" }
torchaudio = { index = "amd-rocm" }

[[tool.uv.index]]
name = "amd-rocm"
url = "https://stable.repo.amd.com/rocm/whl-next/"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "line-profiler>=5.0.2",
    "pyinstrument>=5.1.3",
]
